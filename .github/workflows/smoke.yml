name: smoke → VPS

# The smoke app's own CI, and the deploy path's end-to-end proof, on Onboarding v2: every merge that
# touches the smoke app or the v2 workflow builds smoke/ (smoke/vps.yaml), pushes it as the smoke
# user, publishes smoke/manifests:<sha>, and once smoke is switched over (the live tag, `sudo vps
# cutover smoke`) moves live, calls its Receiver and waits until Flux runs it (the job summary has
# the timings). Its credentials are the smoke app's alone, in this repo's Environment "vps" (main
# only; vps-gitops: bootstrap/vps-onboard smoke). A dispatch from another branch is skipped.
on:
  push:
    branches: [main]
    paths:
      - smoke/**
      - vps/**
      - .github/workflows/smoke.yml
      - .github/workflows/vps-app.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # vps-app.yml joins the tailnet with this run's OIDC token

jobs:
  # `secrets: inherit` is what lets the Environment's secrets reach the called job at all (GitHub
  # passes a called workflow only what its caller passes); this repo has no repository or
  # organisation secrets, so that's all it carries.
  deploy:
    uses: ./.github/workflows/vps-app.yml
    with:
      file: smoke/vps.yaml
    secrets: inherit
