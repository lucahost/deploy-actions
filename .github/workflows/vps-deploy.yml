name: Deploy an app to the VPS cluster (v2)

# Reusable workflow for Onboarding v2 (lucahost/vps-gitops, docs/design.md "Onboarding v2"). The
# caller is the app's source repo, which holds vps.yaml (and deploy/secrets/, deploy/extra/). No
# deploy repo: the rendered manifests go to the box registry as an OCI artifact that Flux reads.
#
#   1. build the components vps.yaml names (and their migrate images) on this runner
#   2. join the tailnet as tag:ci-deploy: one federated identity for every lucahost repo, bound to
#      this file (job_workflow_ref), main and Environment vps
#   3. push registry.internal/<app>/<image>:<sha> as the app's own registry user; read the digests
#   4. render vps.yaml with vps/chart (this commit), pack it with deploy/secrets and deploy/extra
#   5. push the artifact <app>/manifests:<sha>
#   6. if <app>/manifests:live exists and isn't parked (the app is switched over: `vps cutover` moved it), move live
#      to this artifact, call the app's Receiver and wait until Flux applied it and it is healthy.
#      Otherwise stop: the app still runs on its old deploy, and the cutover activates a
#      published artifact.
#
# Credentials: two secrets in the caller's Environment "vps" (main only), VPS_REGISTRY_PASSWORD and
# VPS_RECEIVER_TOKEN, passed with `secrets: inherit`. Everything else is a default here: the
# tailnet host, the registry user (= the app), the Receiver path (derived from its token), and the
# Tailscale identity. Steps read only env (never ${{ }} inside a script), so test/vps-deploy/selftest.sh
# runs these exact scripts against a local registry and a fake Flux.

on:
  workflow_call:
    inputs:
      file:
        description: The app's vps.yaml (a repo deploying several apps has vps/<app>.yaml files)
        required: false
        type: string
        default: vps.yaml
      per-app-secrets:
        description: >-
          A repo with several apps (vps/<app>.yaml) keeps each app's two secrets in its one Environment vps
          as VPS_REGISTRY_PASSWORD_<APP> and VPS_RECEIVER_TOKEN_<APP> (APP in upper case, - as _)
        required: false
        type: boolean
        default: false
      wait-seconds:
        description: How long Flux may take to apply the artifact and get the workloads healthy
        required: false
        type: number
        default: 420
    outputs:
      artifact:
        description: The artifact this run pushed, <app>/manifests:<sha>@<digest>
        value: ${{ jobs.deploy.outputs.artifact }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to the VPS cluster
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: vps
    permissions:
      contents: read
      id-token: write          # the OIDC token Tailscale's workload identity checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: vps-deploy-${{ github.repository }}-${{ inputs.file }}
      cancel-in-progress: false
    outputs:
      artifact: ${{ steps.publish.outputs.artifact }}
    env:
      FILE: ${{ inputs.file }}
      PER_APP_SECRETS: ${{ inputs.per-app-secrets }}
      SHA: ${{ github.sha }}
      SOURCE_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      VPS_HOST: hetzner-ubuntu-16gb.zuul-stonecat.ts.net
      REGISTRY_PORT: "8446"
      HOOK_PORT: "8447"
      # The federated identities of docs/design.md (owner's one-time step 1); not secrets. GitHub gives
      # repos created after 2026-07-15 an immutable OIDC subject (repo:lucahost@<owner id>/<repo>@<repo
      # id>:…), which subject repo:lucahost/* doesn't match: those join with the second identity
      # (subject repo:lucahost@5907956/*, the same claims; created 2026-11-27). The job picks by its
      # own token's sub (test/vps-deploy/selftest.sh checks the pick).
      TS_OIDC_CLIENT_ID: TMABUofcLG11CNTRL-ktb1epw53B11CNTRL
      TS_OIDC_AUDIENCE: api.tailscale.com/TMABUofcLG11CNTRL-ktb1epw53B11CNTRL
      TS_OIDC_CLIENT_ID_IMMUTABLE: TMABUofcLG11CNTRL-kYuNJx7eqA21CNTRL
      TS_OIDC_AUDIENCE_IMMUTABLE: api.tailscale.com/TMABUofcLG11CNTRL-kYuNJx7eqA21CNTRL
      FLUX_VERSION: 2.9.6
      FLUX_SHA256: b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5   # linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The secrets' names (per app in a repo with several)
        id: names
        run: |
          [ -f "$FILE" ] || { echo "::error::no $FILE in this repo"; exit 1; }
          app=$(yq -r '.app // ""' "$FILE")
          [[ "$app" =~ ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$ ]] || { echo "::error::$FILE: bad or missing app '$app'"; exit 1; }
          sfx=""; if [ "${PER_APP_SECRETS:-false}" = true ]; then sfx=_$(tr 'a-z-' 'A-Z_' <<<"$app"); fi
          echo "secrets: VPS_REGISTRY_PASSWORD$sfx, VPS_RECEIVER_TOKEN$sfx"
          echo "suffix=$sfx" >> "$GITHUB_OUTPUT"

      - name: Check inputs and secrets
        id: check
        env:
          SET_VPS_REGISTRY_PASSWORD: ${{ secrets[format('VPS_REGISTRY_PASSWORD{0}', steps.names.outputs.suffix)] != '' }}
          SET_VPS_RECEIVER_TOKEN: ${{ secrets[format('VPS_RECEIVER_TOKEN{0}', steps.names.outputs.suffix)] != '' }}
          SECRET_SUFFIX: ${{ steps.names.outputs.suffix }}
        run: |
          [ -f "$FILE" ] || { echo "::error::no $FILE in this repo"; exit 1; }
          app=$(yq -r '.app // ""' "$FILE")
          [[ "$app" =~ ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$ ]] || { echo "::error::$FILE: bad or missing app '$app'"; exit 1; }
          missing=""
          for v in VPS_REGISTRY_PASSWORD VPS_RECEIVER_TOKEN; do
            set_var="SET_$v"; [ "${!set_var:-}" = true ] || missing+=" $v${SECRET_SUFFIX:-}"
          done
          [ -z "$missing" ] || { echo "::error::empty in this job:$missing (Environment vps of this repo, passed with secrets: inherit; vps-onboard sets them)"; exit 1; }
          [ -n "$TS_OIDC_CLIENT_ID" ] && [ -n "$TS_OIDC_AUDIENCE" ] || [ "${VPS_DEPLOY_SELFTEST:-}" = 1 ] \
            || { echo "::error::vps-deploy.yml has no Tailscale identity yet (the owner's one-time step 1, then set TS_OIDC_* here)"; exit 1; }
          { echo "app=$app"; echo "t_start=$(date +%s)"; } >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        env:
          APP: ${{ steps.check.outputs.app }}
        run: |
          # FILE: the job's env. One image per component with build:, and one per migrate with build:. Names: <component>,
          # <component>-migrate. Components with image: run a pinned third-party image (allowlisted).
          # shellcheck disable=SC2153  # FILE comes from the job's env
          # yq only converts; jq selects (yq's `,` inside a pipe dropped the migrate builds).
          builds=$(yq -o=json '.' "$FILE" | jq -c '[.components | to_entries[] | (select(.value.build) | {name: .key, b: .value.build}), (select(.value.migrate.build) | {name: (.key + "-migrate"), b: .value.migrate.build})]')
          n=$(jq length <<<"$builds")
          for i in $(seq 0 $((n - 1))); do
            name=$(jq -r ".[$i].name" <<<"$builds"); ctx=$(jq -r ".[$i].b.context" <<<"$builds")
            file=$(jq -r ".[$i].b.dockerfile // empty" <<<"$builds"); file=${file:-$ctx/Dockerfile}
            [[ "$name" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || { echo "::error::bad image name $name"; exit 1; }
            echo "::group::$name ← $ctx ($file)"
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
              --label "org.opencontainers.image.revision=$SHA" --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPO" \
              --build-arg "GIT_SHA=$SHA" -f "$file" -t "vps-app/$APP/$name:$SHA" "$ctx"
            echo "::endgroup::"
          done
          { echo "names=$(jq -c '[.[].name]' <<<"$builds")"; echo "t_built=$(date +%s)"; } >> "$GITHUB_OUTPUT"

      - name: Pick the Tailscale identity by this job's OIDC subject
        id: identity
        if: ${{ env.TS_OIDC_CLIENT_ID != '' }}
        run: |
          # The job's own token (GitHub's endpoint and request token are the runner's env): only its sub
          # claim is read, the token is never printed or kept.
          tok=$(curl -fsS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$TS_OIDC_AUDIENCE" | jq -r '.value // empty')
          p=$(cut -d. -f2 <<<"$tok" | tr '_-' '/+'); tok=""
          while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
          sub=$(base64 -d <<<"$p" 2>/dev/null | jq -r '.sub // empty')
          case "$sub" in
            repo:lucahost/*) id=$TS_OIDC_CLIENT_ID; aud=$TS_OIDC_AUDIENCE;;
            # lucahost's owner id: the second identity's subject is repo:lucahost@5907956/*
            repo:lucahost@5907956/*)
              id=$TS_OIDC_CLIENT_ID_IMMUTABLE; aud=$TS_OIDC_AUDIENCE_IMMUTABLE
              [ -n "$id" ] && [ -n "$aud" ] \
                || { echo "::error::this repo's OIDC subject is immutable ($sub): vps-deploy.yml has no second Tailscale identity yet (TS_OIDC_*_IMMUTABLE, the owner's step)"; exit 1; };;
            *) echo "::error::unexpected OIDC subject '$sub'"; exit 1;;
          esac
          echo "OIDC subject $sub → Tailscale client $id"
          { echo "client-id=$id"; echo "audience=$aud"; } >> "$GITHUB_OUTPUT"

      - name: Join the tailnet (tag:ci-deploy reaches only :8446 and :8447 on the VPS)
        if: ${{ env.TS_OIDC_CLIENT_ID != '' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ steps.identity.outputs.client-id }}
          audience: ${{ steps.identity.outputs.audience }}
          tags: tag:ci-deploy

      - name: Resolve the VPS on the tailnet
        if: ${{ env.TS_OIDC_CLIENT_ID != '' }}
        run: |
          ip=$(sudo tailscale status --json | jq -r --arg h "$VPS_HOST." '[.Peer[] | select(.DNSName == $h) | .TailscaleIPs[0]][0] // empty')
          [ -n "$ip" ] || { echo "::error::$VPS_HOST isn't a peer this runner can see (Tailscale ACL for the tag?)"; exit 1; }
          echo "$ip $VPS_HOST" | sudo tee -a /etc/hosts >/dev/null

      - name: Push the images as the app's registry user
        id: push
        env:
          APP: ${{ steps.check.outputs.app }}
          NAMES: ${{ steps.build.outputs.names }}
          VPS_REGISTRY_PASSWORD: ${{ secrets[format('VPS_REGISTRY_PASSWORD{0}', steps.names.outputs.suffix)] }}
          REGISTRY_SCHEME: https
        run: |
          command -v skopeo >/dev/null || sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y skopeo >/dev/null
          reg="${REGISTRY_HOST:-$VPS_HOST:$REGISTRY_PORT}"
          work=$(mktemp -d)
          ( umask 077; AUTH=$(printf '%s:%s' "$APP" "$VPS_REGISTRY_PASSWORD" | base64 -w0) \
              jq -n --arg r "$reg" '{auths: {($r): {auth: $ENV.AUTH}}}' > "$work/auth.json" )
          tls=(); [ "$REGISTRY_SCHEME" = https ] || tls=(--dest-tls-verify=false)
          accept='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json'
          images='{}'
          for name in $(jq -r '.[]' <<<"$NAMES"); do
            skopeo copy --quiet --format oci --authfile "$work/auth.json" "${tls[@]}" \
              "docker-daemon:vps-app/$APP/$name:$SHA" "docker://$reg/$APP/$name:$SHA"
            digest=$(printf 'user = "%s:%s"\n' "$APP" "$VPS_REGISTRY_PASSWORD" \
              | curl -fsS --max-time 30 -K - -I -H "Accept: $accept" "$REGISTRY_SCHEME://$reg/v2/$APP/$name/manifests/$SHA" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" {print $2}')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::no digest for $APP/$name:$SHA"; exit 1; }
            echo "pushed $APP/$name:$SHA → $digest"
            images=$(jq -c --arg k "$name" --arg v "registry.internal/$APP/$name:$SHA@$digest" '. + {($k): $v}' <<<"$images")
          done
          rm -rf "$work"
          { echo "images=$images"; echo "t_pushed=$(date +%s)"; } >> "$GITHUB_OUTPUT"

      - name: Render and pack
        id: render
        # The chart and scripts of the deploy-actions commit below. test/vps-deploy/structure.py checks that
        # vps/ at that commit is vps/ at this file's commit (bump both together).
        uses: lucahost/deploy-actions/vps@871ac5bc73c9e566de4820020e853000bdf27463 # vps render and pack
        with:
          file: ${{ inputs.file }}
          images: ${{ steps.push.outputs.images }}
          revision: ${{ github.sha }}
          out: ${{ runner.temp }}/artifact

      - name: Push the artifact
        id: publish
        env:
          APP: ${{ steps.check.outputs.app }}
          VPS_REGISTRY_PASSWORD: ${{ secrets[format('VPS_REGISTRY_PASSWORD{0}', steps.names.outputs.suffix)] }}
          FLUX_INSECURE: ""
        run: |
          work=$(mktemp -d)
          if ! command -v flux >/dev/null || ! flux version --client 2>/dev/null | grep -q "$FLUX_VERSION"; then
            curl -fsSL -o "$work/flux.tgz" "https://github.com/fluxcd/flux2/releases/download/v$FLUX_VERSION/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
            echo "$FLUX_SHA256  $work/flux.tgz" | sha256sum -c - >/dev/null
            tar -xzf "$work/flux.tgz" -C "$work" flux
            sudo install -m 0755 "$work/flux" /usr/local/bin/flux
          fi
          reg="${REGISTRY_HOST:-$VPS_HOST:$REGISTRY_PORT}"
          export DOCKER_CONFIG=$work/docker
          ( umask 077; install -d "$DOCKER_CONFIG"; AUTH=$(printf '%s:%s' "$APP" "$VPS_REGISTRY_PASSWORD" | base64 -w0) \
              jq -n --arg r "$reg" '{auths: {($r): {auth: $ENV.AUTH}}}' > "$DOCKER_CONFIG/config.json" )
          insecure=(); [ -z "$FLUX_INSECURE" ] || insecure=(--insecure-registry)
          out=$(flux push artifact "oci://$reg/$APP/manifests:$SHA" --path "$RUNNER_TEMP/artifact" \
                  --source "https://github.com/$SOURCE_REPO" --revision "main@sha1:$SHA" "${insecure[@]}" 2>&1) \
            || { echo "$out"; echo "::error::flux push artifact failed"; exit 1; }
          digest=$(grep -oE 'sha256:[a-f0-9]{64}' <<<"$out" | tail -1)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "$out"; echo "::error::no digest from flux push artifact"; exit 1; }
          echo "pushed $APP/manifests:$SHA ($digest)"
          # Switched over? The cutover created live; until then this run only publishes. A rollback or
          # `vps reset` parks the app instead (vps-gitops As built 21): live is then the platform's empty
          # artifact, annotated vps.hostettler.io/parked, and this run only publishes too.
          mt=application/vnd.oci.image.manifest.v1+json
          code=$(printf 'user = "%s:%s"\n' "$APP" "$VPS_REGISTRY_PASSWORD" | curl -s -o "$work/live.json" -w '%{http_code}' --max-time 20 -K - \
            -H "Accept: $mt" "${REGISTRY_SCHEME:-https}://$reg/v2/$APP/manifests/manifests/live")
          if [ "$code" = 200 ] && [ "$(jq -r '.annotations["vps.hostettler.io/parked"] // ""' "$work/live.json" 2>/dev/null)" = true ]; then code=parked; fi
          case "$code" in
            200) live=true
                 # Moving a tag is the distribution API itself: this artifact's manifest, byte for byte,
                 # PUT under "live" (flux tag artifact has no flag for the self-test's plain-HTTP registry).
                 if ! printf 'user = "%s:%s"\n' "$APP" "$VPS_REGISTRY_PASSWORD" | curl -fsS --max-time 30 -K - -H "Accept: $mt" \
                        -o "$work/manifest.json" "${REGISTRY_SCHEME:-https}://$reg/v2/$APP/manifests/manifests/$digest" \
                    || ! printf 'user = "%s:%s"\n' "$APP" "$VPS_REGISTRY_PASSWORD" | curl -fsS --max-time 30 -K - -X PUT -H "Content-Type: $mt" \
                        --data-binary @"$work/manifest.json" -o /dev/null "${REGISTRY_SCHEME:-https}://$reg/v2/$APP/manifests/manifests/live"; then
                   echo "::error::couldn't move live"; exit 1
                 fi
                 echo "live → $SHA ($digest)";;
            404) live=false; echo "no live tag: $APP isn't switched over yet, so this run only publishes";;
            parked) live=false; echo "live is parked (rolled back or reset): $APP isn't switched over, so this run only publishes";;
            *)   echo "::error::registry answered $code for $APP/manifests:live"; exit 1;;
          esac
          rm -rf "$work"
          { echo "artifact=$APP/manifests:$SHA@$digest"; echo "digest=$digest"; echo "live=$live"; echo "t_published=$(date +%s)"; } >> "$GITHUB_OUTPUT"

      - name: Call the app's Flux Receiver
        id: notify
        if: ${{ steps.publish.outputs.live == 'true' }}
        env:
          APP: ${{ steps.check.outputs.app }}
          VPS_RECEIVER_TOKEN: ${{ secrets[format('VPS_RECEIVER_TOKEN{0}', steps.names.outputs.suffix)] }}
        run: |
          work=$(mktemp -d)
          ( umask 077; printf '%s' "$VPS_RECEIVER_TOKEN" > "$work/key" )
          # Flux's path: sha256(token + Receiver name + namespace).
          hook=$(printf '%s%s%s' "$(cat "$work/key")" "receiver-$APP" flux-system | sha256sum | cut -d' ' -f1)
          url="${HOOK_BASE:-https://$VPS_HOST:$HOOK_PORT}/hook/$hook"
          jq -cn --arg app "$APP" --arg repo "$SOURCE_REPO" --arg sha "$SHA" --arg run "$RUN_ID" \
            '{app: $app, repo: $repo, sha: $sha, run: $run}' | tr -d '\n' > "$work/body.json"
          sig=$(python3 -I -c 'import hashlib, hmac, sys
          print(hmac.new(open(sys.argv[1], "rb").read(), open(sys.argv[2], "rb").read(), hashlib.sha256).hexdigest())' "$work/key" "$work/body.json")
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-all-errors -X POST \
            -H 'Content-Type: application/json' -H "X-Signature: sha256=$sig" --data-binary @"$work/body.json" "$url")
          rm -rf "$work"
          [ "$code" = 200 ] || { echo "::error::the Receiver answered $code"; exit 1; }
          echo "t_notified=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Wait until Flux applied it and the app is healthy
        id: wait
        if: ${{ steps.publish.outputs.live == 'true' }}
        env:
          APP: ${{ steps.check.outputs.app }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          WAIT_SECONDS: ${{ inputs.wait-seconds }}
        run: |
          status_url="${HOOK_BASE:-https://$VPS_HOST:$HOOK_PORT}/status/$APP"
          deadline=$(( $(date +%s) + WAIT_SECONDS )); last=""
          while :; do
            json=$(curl -fsS --max-time 10 "$status_url" 2>/dev/null || true)
            jq -e . >/dev/null 2>&1 <<<"$json" || json='{}'
            read -r applied attempted ready reason < <(jq -r '[.status.lastAppliedRevision // "-", .status.lastAttemptedRevision // "-",
              ([(.status.conditions // [])[] | select(.type == "Ready")][0] | (.status // "-"), (.reason // "-"))] | @tsv' <<<"$json")
            msg=$(jq -r '[(.status.conditions // [])[] | select(.type == "Ready")][0].message // ""' <<<"$json")
            now="Ready=$ready ($reason), applied ${applied}"
            [ "$now" = "$last" ] || { echo "$(date +%T) $now"; last=$now; }
            # An OCI source's revision is "<tag>@sha256:<digest>": live, at this run's artifact.
            if [[ "$applied" == *"@$DIGEST" ]] && [ "$ready" = True ]; then break; fi
            if [[ "$attempted" == *"@$DIGEST" ]] && [ "$ready" = False ] && [ "$reason" != Progressing ]; then
              echo "::error::Flux couldn't apply it: $msg"; exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "::error::not applied and healthy after ${WAIT_SECONDS}s (last: $now; $msg)"; exit 1; fi
            sleep 3
          done
          echo "live: $APP@${SHA:0:7} applied, Ready"
          echo "t_live=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Summary
        id: summary
        if: always()
        env:
          APP: ${{ steps.check.outputs.app }}
          LIVE: ${{ steps.publish.outputs.live }}
          ARTIFACT: ${{ steps.publish.outputs.artifact }}
          IMAGES: ${{ steps.push.outputs.images }}
          T_START: ${{ steps.check.outputs.t_start }}
          T_BUILT: ${{ steps.build.outputs.t_built }}
          T_PUSHED: ${{ steps.push.outputs.t_pushed }}
          T_PUBLISHED: ${{ steps.publish.outputs.t_published }}
          T_LIVE: ${{ steps.wait.outputs.t_live }}
        run: |
          d() { [ -n "$1" ] && [ -n "$2" ] && echo "$(( $2 - $1 )) s" || echo "–"; }
          {
            echo "### $APP → VPS"
            echo
            echo "| step | time |"; echo "|---|---|"
            echo "| build | $(d "$T_START" "$T_BUILT") |"
            echo "| push images | $(d "$T_BUILT" "$T_PUSHED") |"
            echo "| render, pack, push artifact | $(d "$T_PUSHED" "$T_PUBLISHED") |"
            echo "| Flux applied + healthy | $(d "$T_PUBLISHED" "$T_LIVE") |"
            echo "| **job start → live** | **$(d "$T_START" "$T_LIVE")** |"
            echo
            echo "Artifact: \`${ARTIFACT:-–}\`"
            [ "$LIVE" = true ] || { echo; echo "**Published only**: no \`live\` tag, or \`live\` parked, so the app isn't switched over and nothing was applied."; }
          } >> "$GITHUB_STEP_SUMMARY"
