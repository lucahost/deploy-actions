name: Tailscale identity check

# Live check of the one federated Tailscale identity (lucahost/vps-gitops docs/design.md, "Onboarding
# v2"; the owner's one-time step 1): subject repo:lucahost/*, claims environment=vps,
# ref=refs/heads/main, repository_owner=lucahost,
# job_workflow_ref=lucahost/deploy-actions/.github/workflows/vps-deploy.yml@*. Tailscale documents
# `*` and custom claims, but not that every claim must match: each job below tries to join with
# that identity in a way the claims must refuse, and `verdict` fails unless every one of them was
# refused. The positive case is any vps-deploy.yml run (smoke).
#
# Each attempt is a step with continue-on-error, judged by its *outcome* (a job-level
# continue-on-error would report a refused job as "success" to `needs`, and hide the difference).
#
# Run it from Actions → "Tailscale identity check" → Run workflow:
#   1. on main: no-environment and own-workflow must be refused;
#   2. on any other branch: the same, and GitHub refuses Environment vps to the branch (deployment
#      branch policy) before own-workflow starts, which counts as refused.
#
# The second identity (subject repo:lucahost@5907956/*, for repos with immutable OIDC subjects,
# created after 2026-07-15) is checked from such a repo: a workflow there calls this one
# (`uses: lucahost/deploy-actions/.github/workflows/tailscale-identity-check.yml@<sha>`, with
# permissions contents: read, id-token: write, actions: read). The identity job picks the pair by
# its own token's subject, as vps-deploy.yml does.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      client-id: ${{ steps.read.outputs.client-id }}
      audience: ${{ steps.read.outputs.audience }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lucahost/deploy-actions   # this repo's vps-deploy.yml, also when called from an app repo
          path: deploy-actions
          persist-credentials: false
      - id: read
        run: |
          f=deploy-actions/.github/workflows/vps-deploy.yml
          # The job's own token: only its sub claim is read (as vps-deploy.yml's identity step).
          tok=$(curl -fsS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.tailscale.com" | jq -r '.value // empty')
          p=$(cut -d. -f2 <<<"$tok" | tr '_-' '/+'); tok=""
          while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
          sub=$(base64 -d <<<"$p" 2>/dev/null | jq -r '.sub // empty')
          case "$sub" in
            repo:lucahost/*) sfx="";;
            repo:lucahost@5907956/*) sfx=_IMMUTABLE;;   # as vps-deploy.yml's identity step
            *) echo "::error::unexpected OIDC subject '$sub'"; exit 1;;
          esac
          id=$(yq -r ".jobs.deploy.env.TS_OIDC_CLIENT_ID$sfx" "$f")
          aud=$(yq -r ".jobs.deploy.env.TS_OIDC_AUDIENCE$sfx" "$f")
          [ -n "$id" ] && [ "$id" != null ] && [ -n "$aud" ] && [ "$aud" != null ] || { echo "::error::vps-deploy.yml has no TS_OIDC_*$sfx yet"; exit 1; }
          echo "OIDC subject $sub → the identity TS_OIDC_CLIENT_ID$sfx ($id)"
          { echo "client-id=$id"; echo "audience=$aud"; } >> "$GITHUB_OUTPUT"

  # The token has no environment claim.
  no-environment:
    needs: identity
    runs-on: ubuntu-24.04
    outputs:
      joined: ${{ steps.join.outcome == 'success' }}
    steps:
      - id: join
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ needs.identity.outputs.client-id }}
          audience: ${{ needs.identity.outputs.audience }}
          tags: tag:ci-deploy

  # Environment vps (on main), but this file's own step: job_workflow_ref isn't vps-deploy.yml.
  own-workflow:
    needs: identity
    runs-on: ubuntu-24.04
    environment: vps
    outputs:
      joined: ${{ steps.join.outcome == 'success' }}
    steps:
      - id: join
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ needs.identity.outputs.client-id }}
          audience: ${{ needs.identity.outputs.audience }}
          tags: tag:ci-deploy

  # A refusal counts only with proof: Tailscale's own answer (status 403, "Unauthorized") in the
  # attempt's log, read through the API once the attempt's job has finished; or, for own-workflow
  # dispatched from a branch, GitHub refusing Environment vps before any step ran. A join error
  # of any other kind (network, the action itself) is no verdict and fails.
  verdict:
    needs: [no-environment, own-workflow]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          REF: ${{ github.ref }}
          NO_ENV_JOINED: ${{ needs.no-environment.outputs.joined }}
          OWN_JOINED: ${{ needs.own-workflow.outputs.joined }}
        run: |
          echo "ref $REF"
          api() { curl -fsSL --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/$1"; }
          jobs=$(api "actions/runs/$RUN/jobs?per_page=100")
          bad=0
          for r in "no-environment|$NO_ENV_JOINED" "own-workflow|$OWN_JOINED"; do
            IFS='|' read -r name joined <<<"$r"
            # Called from another workflow, a job's name is "<caller job> / <name>".
            sel='.jobs[] | select(.name == $n or (.name | endswith(" / " + $n)))'
            id=$(jq -r --arg n "$name" "[$sel | .id][0] // empty" <<<"$jobs")
            steps=$(jq -r --arg n "$name" "[$sel | .steps[]?] | length" <<<"$jobs")
            log=$(api "actions/jobs/$id/logs" 2>/dev/null || true)
            if [ "$joined" = true ]; then
              echo "::error::$name JOINED the tailnet"; bad=1
            elif grep -q 'status 403' <<<"$log" && grep -q 'Unauthorized' <<<"$log"; then
              echo "refused by Tailscale, as it must be: $name ($(grep -o 'status 403[^}]*}' <<<"$log" | head -1))"
            elif [ "$name" = own-workflow ] && [ "$REF" != refs/heads/main ] && [ "$steps" = 0 ]; then
              echo "refused by GitHub, as it must be: $name (Environment vps isn't for $REF)"
            else
              echo "::error::$name: no proof of a refusal (joined=$joined, $steps steps); look at its log"; bad=1
            fi
          done
          exit "$bad"
